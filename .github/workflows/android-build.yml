name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar local.properties temporal para Gradle
        run: |
          echo "AI_API_KEY=${{ secrets.AI_API_KEY }}" > local.properties
          echo "PICOVOICE_KEY=${{ secrets.PICOVOICE_KEY }}" >> local.properties

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Ejecutar pruebas unitarias
        run: ./gradlew testDebugUnitTest

      - name: Compilar APK de debug
        run: ./gradlew assembleDebug
        
