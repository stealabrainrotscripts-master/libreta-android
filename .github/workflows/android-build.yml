      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar entorno Android SDK
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          
