name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar entorno Android SDK y local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "ANTHROPIC_KEY=${{ secrets.ANTHROPIC_KEY }}" >> local.properties
          echo "AI_API_KEY=${{ secrets.AI_API_KEY }}" >> local.properties
          echo "AI_PROVIDER=${{ secrets.AI_PROVIDER }}" >> local.properties
          echo "AI_BASE_URL=${{ secrets.AI_BASE_URL }}" >> local.properties
          echo "AI_MODEL=${{ secrets.AI_MODEL }}" >> local.properties
          echo "PICOVOICE_KEY=${{ secrets.PICOVOICE_KEY }}" >> local.properties
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso de ejecución a gradlew (si existe)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Ejecutar pruebas unitarias
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew testDebugUnitTest --stacktrace
          else
            gradle testDebugUnitTest --stacktrace
          fi

      - name: Compilar APK de debug
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Subir APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error          
